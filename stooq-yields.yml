name: stooq-yields

# Non-US sovereign 10Y yields from Stooq, fetched off-VM (Stooq
# bot-checks the news VM's network). Raw CSVs + manifest are
# committed under stooq-yields/; the VM receiver pulls them via the
# GitHub API and merges them into Global Markets hourly.

on:
  workflow_dispatch:
  schedule:
    - cron: "17 22 * * *"

permissions:
  contents: write

concurrency:
  group: stooq-yields
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch Stooq yield CSVs
        run: python3 stooq-yields/fetch_stooq_yields.py
      - name: Commit results
        run: |
          git config user.name "stooq-yields bot"
          git config user.email "actions@github.com"
          git add stooq-yields/
          if git diff --cached --quiet; then
            echo "no changes to commit"
          else
            git commit -m "stooq yields $(date -u +%Y-%m-%dT%H:%MZ)"
            git push
          fi
